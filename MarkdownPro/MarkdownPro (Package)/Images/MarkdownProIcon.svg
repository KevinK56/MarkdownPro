<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background tile shadow -->
    <filter id="tile-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Glass plate drop shadow -->
    <filter id="plate-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000e24" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000e24" flood-opacity="0.15" />
    </filter>

    <!-- Subtle glow for the Pro accent -->
    <filter id="pro-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0078D4" flood-opacity="0.45" />
    </filter>

    <!-- Acrylic Windows background gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- App sheet gradient (Fluent Mica / Acrylic style) -->
    <linearGradient id="sheet-grad" x1="120" y1="72" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A384C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#141E2E" stop-opacity="0.95" />
    </linearGradient>

    <!-- Fluent Blue accent gradient -->
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60CDFF" />
      <stop offset="50%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#005A9E" />
    </linearGradient>

    <!-- Inner document highlight stroke -->
    <linearGradient id="sheet-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- Subtle inner surface bevel -->
    <linearGradient id="tile-stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Windows App Icon Base Canvas -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="100" 
    fill="url(#bg-grad)" 
    filter="url(#tile-shadow)" 
  />
  <rect 
    x="32.5" 
    y="32.5" 
    width="447" 
    height="447" 
    rx="99.5" 
    fill="none" 
    stroke="url(#tile-stroke)" 
    stroke-width="1.5" 
  />

  <!-- Subtle editor guide lines in background -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="88" y1="120" x2="424" y2="120" />
    <line x1="88" y1="176" x2="424" y2="176" />
    <line x1="88" y1="232" x2="424" y2="232" />
    <line x1="88" y1="288" x2="424" y2="288" />
    <line x1="88" y1="344" x2="424" y2="344" />
    <line x1="88" y1="400" x2="424" y2="400" />
  </g>

  <!-- Central Editor Plate / Document Card -->
  <g filter="url(#plate-shadow)">
    <rect 
      x="76" 
      y="104" 
      width="360" 
      height="260" 
      rx="24" 
      fill="url(#sheet-grad)" 
    />
    <rect 
      x="76.5" 
      y="104.5" 
      width="359" 
      height="259" 
      rx="23.5" 
      fill="none" 
      stroke="url(#sheet-border)" 
      stroke-width="1.5" 
    />
  </g>

  <!-- Markdown Standard Emblem Shapes (Styled with Windows Fluent Curves) -->
  <g fill="#F1F5F9">
    <!-- 'M' Glyphs -->
    <path d="M 124 292 V 176 h 26 l 42 54 l 42 -54 h 26 v 116 h -26 v -68 l -42 52 l -42 -52 v 68 Z" />

    <!-- Markdown Arrow Stem -->
    <rect x="330" y="176" width="28" height="66" rx="4" />
    
    <!-- Markdown Arrow Head -->
    <path d="M 302 232 L 344 292 L 386 232 Z" stroke-linejoin="round" />
  </g>

  <!-- Pro Badge Indicator (Floating pill) -->
  <g filter="url(#pro-glow)">
    <rect 
      x="286" 
      y="384" 
      width="154" 
      height="44" 
      rx="22" 
      fill="url(#accent-grad)" 
    />
    <rect 
      x="286.75" 
      y="384.75" 
      width="152.5" 
      height="42.5" 
      rx="21.25" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-opacity="0.35" 
      stroke-width="1.5" 
    />
    <!-- "PRO" Typographic Mark -->
    <text 
      x="363" 
      y="414" 
      fill="#FFFFFF" 
      font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
      font-size="20" 
      font-weight="800" 
      letter-spacing="3.5" 
      text-anchor="middle"
    >PRO</text>
  </g>
</svg>
