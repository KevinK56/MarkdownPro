<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Pro Live Preview</title>
    <style id="previewStyles">
        :root {
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Mono', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #24292e;
            font-family: var(--font-ui);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        body.dark-preview {
            background-color: #0d1117 !important;
            color: #c9d1d9 !important;
        }

        #renderedOutput {
            padding: 32px 40px;
            max-width: 100%;
            margin: 0 auto;
            font-family: var(--font-ui);
            line-height: 1.6;
            color: #24292e;
            word-wrap: break-word;
        }

        body.focus-mode #renderedOutput {
            max-width: 1000px;
            padding: 40px 48px;
        }

        body.dark-preview #renderedOutput {
            background-color: #0d1117 !important;
            color: #c9d1d9 !important;
        }

        #renderedOutput h1,
        #renderedOutput h2 {
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }

        #renderedOutput h1:first-child,
        #renderedOutput h2:first-child {
            margin-top: 0;
        }

        body.dark-preview #renderedOutput h1,
        body.dark-preview #renderedOutput h2,
        body.dark-preview #renderedOutput h3,
        body.dark-preview #renderedOutput h4 {
            border-color: #30363d !important;
            color: #f0f6fc !important;
        }

        #renderedOutput blockquote {
            border-left: 0.25em solid #dfe2e5;
            color: #6a737d;
            padding: 0 1em;
            margin: 0 0 1rem 0;
        }

        body.dark-preview #renderedOutput blockquote {
            border-left-color: #30363d;
            color: #8b949e;
        }

        #renderedOutput code {
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.9em;
        }

        #renderedOutput pre {
            background: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow: auto;
            font-family: var(--font-mono);
        }

        #renderedOutput pre code {
            background: transparent;
            padding: 0;
        }

        body.dark-preview #renderedOutput code,
        body.dark-preview #renderedOutput pre {
            background-color: #161b22 !important;
            color: #c9d1d9 !important;
        }

        #renderedOutput table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        #renderedOutput table th,
        #renderedOutput table td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
            text-align: left;
        }

        body.dark-preview #renderedOutput table th,
        body.dark-preview #renderedOutput table td {
            border-color: #30363d;
        }

        #renderedOutput table tr:nth-child(2n) {
            background-color: #f6f8fa;
        }

        body.dark-preview #renderedOutput table tr:nth-child(2n) {
            background-color: #161b22 !important;
        }

        #renderedOutput hr {
            border: none;
            border-top: 1px solid #eaecef;
            margin: 1.5rem 0;
        }

        body.dark-preview #renderedOutput hr {
            border-top-color: #30363d;
        }

        #renderedOutput img {
            max-width: 100%;
            height: auto;
        }

        #renderedOutput a {
            color: #0969da;
            text-decoration: none;
        }

        #renderedOutput a:hover {
            text-decoration: underline;
        }

        body.dark-preview #renderedOutput a {
            color: #58a6ff;
        }

        /* Visual Page Break indicator in live preview (hidden in print) */
        div[style*="page-break-after: always"] {
            border-top: 1px dashed #adb5bd;
            margin: 24px 0;
            position: relative;
        }

        @media screen {
            div[style*="page-break-after: always"]::after {
                content: "PAGE BREAK";
                position: absolute;
                top: -9px;
                right: 12px;
                background: #f8f9fa;
                color: #6c757d;
                font-size: 10px;
                font-family: var(--font-mono);
                padding: 0 6px;
                border-radius: 3px;
                border: 1px solid #dee2e6;
            }

            body.dark-preview div[style*="page-break-after: always"] {
                border-top-color: #30363d;
            }

            body.dark-preview div[style*="page-break-after: always"]::after {
                background: #161b22;
                color: #8b949e;
                border-color: #30363d;
            }
        }

        @media print {
            html, body {
                height: auto !important;
                overflow: visible !important;
                background: white !important;
                color: #000 !important;
                margin: 0 !important;
                padding: 0 !important;
                font-size: 11pt;
            }

            #renderedOutput {
                overflow: visible !important;
                height: auto !important;
                max-width: 100% !important;
                padding: 1cm 0 !important;
                color: #000 !important;
                background: white !important;
            }

            #renderedOutput h1,
            #renderedOutput h2,
            #renderedOutput h3,
            #renderedOutput h4 {
                page-break-after: avoid;
                break-after: avoid;
                color: #000 !important;
                border-color: #eaecef !important;
            }

            #renderedOutput p,
            #renderedOutput li,
            #renderedOutput blockquote {
                page-break-inside: avoid;
                break-inside: avoid;
                orphans: 3;
                widows: 3;
            }

            #renderedOutput pre {
                overflow: visible !important;
                white-space: pre-wrap !important;
                word-break: break-word !important;
                page-break-inside: avoid;
                break-inside: avoid;
                border: 1px solid #ddd !important;
                background: #f6f8fa !important;
                color: #24292e !important;
                padding: 8pt;
                font-size: 9pt;
            }

            #renderedOutput code {
                background: #f6f8fa !important;
                color: #24292e !important;
            }

            #renderedOutput svg {
                max-width: 100% !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                page-break-inside: avoid;
                break-inside: avoid;
                display: block;
                margin: 0 auto;
            }

            #renderedOutput .mermaid,
            #renderedOutput [class*="language-mermaid"] {
                overflow: visible !important;
                page-break-inside: avoid;
                break-inside: avoid;
                display: block;
            }

            #renderedOutput table {
                width: 100%;
                page-break-inside: auto;
                border-collapse: collapse;
            }

            #renderedOutput tr {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            #renderedOutput thead {
                display: table-header-group;
            }

            #renderedOutput hr {
                border: none;
                border-top: 1px solid #ccc;
                margin: 12pt 0;
            }

            div[style*="page-break-after: always"] {
                border: none !important;
                margin: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
            }
        }
    </style>
    <script src="marked.min.js"></script>
    <script src="mermaid.min.js"></script>
</head>
<body>
    <div id="renderedOutput"></div>

    <script>
        const output = document.getElementById('renderedOutput');
        let currentRawMarkdown = '';

        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
        }

        async function renderMarkdown(rawValue) {
            if (typeof rawValue === 'string') {
                currentRawMarkdown = rawValue;
            }
            if (!output) return;

            // 1. Convert Markdown to HTML using Marked.js
            if (typeof marked !== 'undefined') {
                output.innerHTML = marked.parse(currentRawMarkdown || '');
            } else {
                output.textContent = currentRawMarkdown || '';
            }

            // 2. Safely capture and transform Mermaid blocks
            const codeBlocks = output.querySelectorAll('pre code.language-mermaid, code.language-mermaid');
            const mermaidNodes = [];

            codeBlocks.forEach(codeBlock => {
                const parentPre = codeBlock.closest('pre');
                const replaceTarget = parentPre || codeBlock;

                const diagramDiv = document.createElement('div');
                diagramDiv.className = 'mermaid';

                // Normalize any auto-corrected Unicode characters (like →, —, or –) back to ASCII Mermaid syntax
                let cleanedText = codeBlock.textContent
                    .replace(/→/g, '-->')
                    .replace(/—>/g, '-->')
                    .replace(/–>/g, '-->');

                diagramDiv.textContent = cleanedText;

                // Define fallback styling in case a diagram contains an unrecoverable syntax error
                diagramDiv.style.whiteSpace = 'pre-wrap';
                diagramDiv.style.fontFamily = 'var(--font-mono)';
                diagramDiv.style.padding = '12px';
                diagramDiv.style.background = '#f8f9fa';
                diagramDiv.style.border = '1px solid #e9ecef';
                diagramDiv.style.borderRadius = '6px';

                replaceTarget.parentNode.insertBefore(diagramDiv, replaceTarget);
                replaceTarget.parentNode.removeChild(replaceTarget);

                mermaidNodes.push(diagramDiv);
            });

            // 3. Render each node individually to isolate syntax errors and avoid cascading failures
            if (mermaidNodes.length > 0 && typeof mermaid !== 'undefined') {
                for (const node of mermaidNodes) {
                    try {
                        await mermaid.run({ nodes: [node] });

                        node.style.whiteSpace = '';
                        node.style.fontFamily = '';
                        node.style.padding = '';
                        node.style.background = '';
                        node.style.border = '';
                        node.style.borderRadius = '';
                    } catch (err) {
                        console.warn('Individual Mermaid diagram failed to parse:', err);

                        node.style.border = '1px dashed #dc3545';
                        node.style.background = '#fff5f5';
                        node.style.color = '#dc3545';
                    }
                }
            }

            const nowStr = new Date().toLocaleTimeString();
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'rendered',
                    timestamp: nowStr,
                    innerHtml: output.innerHTML
                });
            }
            return nowStr;
        }

        function setPreviewTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-preview');
            } else {
                document.body.classList.remove('dark-preview');
            }
        }

        function setFocusMode(isFocus) {
            if (isFocus) {
                document.body.classList.add('focus-mode');
            } else {
                document.body.classList.remove('focus-mode');
            }
        }

        function getRenderedHtml() {
            return output ? output.innerHTML : '';
        }

        function getStandaloneHtml(title) {
            const styles = document.getElementById('previewStyles').innerHTML;
            const bodyClass = document.body.classList.contains('dark-preview') ? ' class="dark-preview"' : '';
            const content = output ? output.innerHTML : '';
            return `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8" />\n<title>${title || 'Markdown Pro Document'}</title>\n<style>${styles}</style>\n</head>\n<body${bodyClass}>\n<div id="renderedOutput">${content}</div>\n</body>\n</html>`;
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', async (event) => {
                const msg = event.data;
                if (!msg || !msg.action) return;

                if (msg.action === 'render') {
                    await renderMarkdown(msg.markdown || '');
                } else if (msg.action === 'theme') {
                    setPreviewTheme(msg.theme);
                } else if (msg.action === 'focus') {
                    setFocusMode(!!msg.enabled);
                }
            });

            window.chrome.webview.postMessage({ type: 'ready' });
        }
    </script>
</body>
</html>
